name: Test and Deploy to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: github-actions-test-secret-key-32-bytes-minimum-1234567890
      JWT_ALGORITHM: HS256
      JWT_TOKEN_EXPIRE_MINUTES: "30"
      AUTH_ADMIN_USERNAME: admin
      AUTH_ADMIN_PASSWORD: github-actions-admin-password
      AUTH_ADMIN_ROLE: admin
      AUTH_USER_USERNAME: test-user
      AUTH_USER_PASSWORD: github-actions-user-password
      AUTH_USER_ROLE: user
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run project checks
        run: make all PYTHON=python

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
