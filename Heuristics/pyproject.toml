[project]
name = "tsp-heuristic-solver"
version = "0.1.0"
description = "Heuristic Traveling Salesman Problem solver using Pandas"
authors = [
    {name = "Pawan Kumar"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "click",
    "matplotlib"
]

[project.scripts]
tsp = "tsp_solver.cli:cli"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
